<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NbmSearch — Вход</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --border: #2d3148;
  --accent: #5b6af0; --text: #e8eaf6; --text-dim: #8b90b8;
  --red: #e74c3c; --radius: 10px; --radius-sm: 6px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; }
.card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 36px 40px; width: 360px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.logo-icon { width: 36px; height: 36px; border-radius: 9px; overflow: hidden; }
.logo-icon img { width: 100%; height: 100%; object-fit: cover; }
.logo-text { font-size: 1.2rem; font-weight: 700; }
h2 { font-size: 1rem; font-weight: 600; margin-bottom: 20px; color: var(--text); }
label { display: block; font-size: .78rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
input[type=password] {
  width: 100%; background: #0f1117; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 14px; font-size: .9rem;
  color: var(--text); outline: none; transition: border-color .2s; margin-bottom: 16px;
}
input[type=password]:focus { border-color: var(--accent); }
.btn { width: 100%; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 11px; font-size: .9rem;
  font-weight: 600; cursor: pointer; transition: background .15s; }
.btn:hover { background: #3d4ab0; }
.error { font-size: .82rem; color: var(--red); margin-bottom: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><img src="/icon.png" alt=""></div>
    <span class="logo-text">NbmSearch</span>
  </div>
  <h2>Вход в панель управления</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label>Пароль</label>
    <input type="password" name="password" autofocus placeholder="••••••••">
    <button type="submit" class="btn">Войти</button>
  </form>
</div>
</body>
</html>
