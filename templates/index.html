<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NbmSearch</title>
<link rel="icon" type="image/png" href="/icon.png">
<script>if(localStorage.getItem('nbm_theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
<style>
:root {
  --bg:       #0f1117; --surface:  #1a1d27; --surface2: #22263a;
  --border:   #2d3148; --accent:   #5b6af0; --accent-dim:#3d4ab0;
  --text:     #e8eaf6; --text-dim: #8b90b8;
  --mark-bg:  #f0c040; --mark-fg:  #1a1d27;
  --green:    #2ecc71; --radius: 10px; --radius-sm: 6px;
}
[data-theme="light"] {
  --bg:       #f2f3f8; --surface:  #ffffff; --surface2: #e8eaf4;
  --border:   #d0d4ea; --accent:   #5b6af0; --accent-dim:#3d4ab0;
  --text:     #1a1d2e; --text-dim: #5a6080;
  --mark-bg:  #f0c040; --mark-fg:  #1a1d27;
  --green:    #1daa5c;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body, body * { user-select: none !important; -webkit-user-select: none !important; }
input[type="text"], input[type="text"] * { user-select: text !important; -webkit-user-select: text !important; }
html { transition: background-color .25s, color .25s; }
body, header, .search-wrap, .result-card, .search-history,
.sc-item, .btn-history, .rc-snippet, .rc-badge, .sidebar {
  transition: background-color .25s, border-color .25s, color .25s; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; overflow: hidden; }

/* ── Header ── */
header { flex-shrink: 0; z-index: 100; background: var(--surface);
  border-bottom: 1px solid var(--border); padding: 0 28px; height: 52px;
  display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 700;
  font-size: 1rem; color: var(--text); text-decoration: none; }
.logo-icon { width: 26px; height: 26px; border-radius: 6px; overflow: hidden; }
.logo-icon img { width: 100%; height: 100%; object-fit: cover; }
nav { display: flex; align-items: center; gap: 8px; }
nav a { color: var(--text-dim); text-decoration: none; font-size: .82rem;
  padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  transition: background .15s, color .15s, border-color .15s; }
nav a:hover { background: var(--surface2); color: var(--text); border-color: #3d4168; }
.btn-theme { background: none; border: 1px solid var(--border); color: var(--text-dim);
  width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background .15s, color .15s, border-color .15s; }
.btn-theme:hover { background: var(--surface2); color: var(--text); border-color: #3d4168; }
.btn-theme .icon-sun { display: none; }
.btn-theme .icon-moon { display: block; }
[data-theme="light"] .btn-theme .icon-sun  { display: block; }
[data-theme="light"] .btn-theme .icon-moon { display: none; }

/* ── Page: flex column, body controls overflow ── */
.page { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* ── Centered search zone (title + form) ── */
.page-search { flex-shrink: 0; max-width: 760px; width: 100%;
  margin: 0 auto; padding: 28px 24px 0; position: relative; }

.hero-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
.hero-sub   { color: var(--text-dim); font-size: .85rem; margin-bottom: 20px; }

/* ── Sidebar: absolute, left of .page-search ── */
.sidebar { position: absolute; right: calc(100% - 24px + 16px);
  top: calc(28px + 1.4rem * 1.2 + 4px + .85rem * 1.5 + 20px); /* below title+sub */
  width: 196px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; z-index: 10; }
.sidebar-head { padding: 10px 14px 8px;
  font-size: .62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .9px; color: var(--text-dim);
  border-bottom: 1px solid var(--border); }
.sidebar-list { overflow-y: auto; max-height: 60vh; }
.sc-item { display: flex; align-items: center; gap: 9px; padding: 8px 14px;
  cursor: pointer; user-select: none; border-left: 2px solid transparent;
  transition: background .12s, border-color .15s; }
.sc-item:hover { background: var(--surface2); }
.sc-item.active { background: rgba(91,106,240,.08); border-left-color: var(--accent); }
.sc-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  background: var(--border); transition: background .15s; }
.sc-item.active .sc-dot { background: var(--accent); }
.sc-name { flex: 1; font-size: .82rem; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .15s; }
.sc-item.active .sc-name, .sc-item:hover .sc-name { color: var(--text); }
.sc-badge { font-size: .65rem; font-weight: 700; padding: 1px 6px;
  border-radius: 5px; background: rgba(91,106,240,.15);
  color: var(--accent); border: 1px solid rgba(91,106,240,.2);
  display: none; flex-shrink: 0; }
.sc-badge.visible { display: inline-block; }
.sidebar-empty { padding: 12px 14px; font-size: .78rem;
  color: var(--text-dim); font-style: italic; line-height: 1.5; }
.sidebar-empty a { color: var(--accent); }

/* ── Search form ── */
.search-wrap { display: flex; gap: 8px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 5px 5px 5px 14px; transition: border-color .2s; }
.search-wrap:focus-within { border-color: var(--accent); }
.search-wrap input { flex: 1; background: none; border: none; outline: none;
  font-size: .95rem; color: var(--text); min-width: 0; }
.search-wrap input::placeholder { color: var(--text-dim); }
.btn-search { background: var(--accent); color: #fff; border: none;
  border-radius: 7px; padding: 8px 18px; font-size: .875rem; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background .15s; }
.btn-search:hover { background: var(--accent-dim); }
.btn-clear { display: none; align-items: center; justify-content: center;
  background: none; border: none; cursor: pointer; color: var(--text-dim);
  padding: 0 6px; border-radius: 4px; transition: color .15s; flex-shrink: 0; }
.btn-clear:hover { color: var(--text); }
.btn-clear.visible { display: flex; }
.search-row { display: flex; gap: 8px; align-items: stretch; }
.search-container { position: relative; flex: 1; min-width: 0; }
.btn-history { width: 100%; display: flex; align-items: center;
  justify-content: center; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); cursor: pointer; color: var(--text-dim);
  transition: border-color .15s, color .15s, background .15s; padding: 0; }
.btn-history:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); }
.btn-history.active { border-color: var(--accent); color: var(--accent); background: rgba(91,106,240,.12); }

/* History dropdown — high z-index, no clip */
.search-history { position: absolute; top: calc(100% + 6px); left: 0;
  width: max-content; min-width: 180px; max-width: 360px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  z-index: 500; overflow: hidden; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.search-history.visible { display: block; }
.sh-item { padding: 10px 14px; font-size: .88rem; color: var(--text-dim); cursor: pointer;
  display: flex; align-items: center; gap: 10px; transition: background .12s, color .12s;
  border-bottom: 1px solid var(--border); white-space: nowrap; }
.sh-item:last-child { border-bottom: none; }
.sh-item:hover { background: var(--surface2); color: var(--text); }
.sh-icon { flex-shrink: 0; opacity: .45; }

/* ── Status bar ── */
.status-bar { flex-shrink: 0; max-width: 760px; width: 100%;
  margin: 10px auto 0; padding: 0 24px;
  min-height: 18px; font-size: .78rem; color: var(--text-dim);
  display: flex; align-items: center; gap: 7px; }
.spinner { width: 13px; height: 13px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .6s linear infinite; display: none; }
.spinner.visible { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Results — only this scrolls ── */
.results-panel { flex: 1; overflow-y: auto; min-height: 0; }
#results { max-width: 760px; width: 100%; margin: 14px auto 0; padding: 0 24px 40px; }
.no-results { text-align: center; padding: 50px 0; color: var(--text-dim); }
.no-results svg { opacity: .3; margin-bottom: 10px; display: block;
  margin-left: auto; margin-right: auto; }

/* ── Result card ── */
.result-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 13px 16px; margin-bottom: 8px; transition: border-color .15s; }
.result-card:hover { border-color: #3d4168; }
.rc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rc-name { font-weight: 600; font-size: .9rem; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-badge { flex-shrink: 0; font-size: .68rem; padding: 2px 7px; border-radius: 6px;
  border: 1px solid var(--border); color: var(--text-dim); background: var(--surface2); }
.rc-badge-dir { border-color: rgba(91,106,240,.3); color: var(--accent); background: var(--accent-bg); }
.ext-pdf  { border-color: #c0392b44; color: #e74c3c; }
.ext-docx,.ext-doc { border-color: #2980b944; color: #3498db; }
.ext-xlsx,.ext-xls { border-color: #27ae6044; color: #2ecc71; }
.ext-txt  { border-color: #7f8c8d44; color: #95a5a6; }
.ext-csv  { border-color: #16a08544; color: #1abc9c; }
.ext-rtf  { border-color: #8e44ad44; color: #9b59b6; }
.rc-snippet { font-size: .82rem; color: var(--text); line-height: 1.6;
  background: var(--surface2); border-left: 2px solid var(--accent);
  padding: 6px 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-bottom: 8px;
  white-space: pre-wrap; }
.rc-snippet mark { background: var(--mark-bg); color: var(--mark-fg);
  border-radius: 2px; padding: 0 2px; font-style: normal; }
.rc-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.rc-meta { display: flex; gap: 12px; font-size: .73rem; color: var(--text-dim); flex-wrap: wrap; }
.rc-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.btn-action { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2);
  color: var(--text-dim); font-size: .72rem; cursor: pointer; text-decoration: none;
  transition: border-color .15s, color .15s; white-space: nowrap; }
.btn-action:hover { border-color: var(--accent); color: var(--text); }

/* ── Full-text modal ── */
.ft-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 600;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.ft-overlay.visible { opacity: 1; pointer-events: all; }
.ft-modal { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); width: min(1032px, 94vw); height: min(80vh, 700px);
  display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.4); }
.ft-modal-head { display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ft-modal-title { font-size: .88rem; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.ft-search-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.ft-search-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--radius-sm); padding: 4px 9px; font-size: .78rem; outline: none;
  width: 160px; font-family: inherit; transition: border-color .15s; }
.ft-search-input:focus { border-color: var(--accent); }
.ft-search-input::placeholder { color: var(--text-dim); }
.ft-search-count { font-size: .72rem; color: var(--text-dim); white-space: nowrap;
  min-width: 36px; text-align: center; }
.ft-btn { background: none; border: 1px solid var(--border); color: var(--text-dim);
  width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s, background .15s; }
.ft-btn:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); }
.ft-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
.ft-close { background: none; border: 1px solid var(--border); color: var(--text-dim);
  width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .15s, color .15s, background .15s; }
.ft-close:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); }
.ft-modal-body { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
.ft-text { font-size: .82rem; color: var(--text); line-height: 1.7;
  white-space: pre-wrap; word-break: break-word; }
.ft-text mark { background: rgba(241,196,15,.35); color: var(--text); border-radius: 2px; padding: 0 1px; }
.ft-text mark.ft-active { background: var(--mark-bg); color: var(--mark-fg); }
.ft-loading { text-align: center; padding: 40px; color: var(--text-dim); font-size: .82rem; }
.ft-spinner { width: 22px; height: 22px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .6s linear infinite; display: inline-block;
  vertical-align: middle; margin-right: 8px; }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon"><img src="/icon.png" alt=""></div>
    NbmSearch
  </a>
  <nav>
    <button class="btn-theme" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">
      <svg class="icon-moon" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="icon-sun" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke-linecap="round"/>
        <line x1="12" y1="21" x2="12" y2="23" stroke-linecap="round"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-linecap="round"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-linecap="round"/>
        <line x1="1" y1="12" x2="3" y2="12" stroke-linecap="round"/>
        <line x1="21" y1="12" x2="23" y2="12" stroke-linecap="round"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke-linecap="round"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke-linecap="round"/>
      </svg>
    </button>
    <a href="/admin">Управление</a>
  </nav>
</header>

<div class="page">

  <!-- Centered: title + search form. Sidebar is absolute to the left of this block. -->
  <div class="page-search" id="pageSearch">

    <!-- Sidebar (positioned absolute, left of .page-search) -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-head">Область поиска</div>
      <div class="sidebar-list" id="sidebarList">
        {% if folders %}
          <div class="sc-item active" data-folder="__all__">
            <span class="sc-dot"></span>
            <span class="sc-name">Везде</span>
            <span class="sc-badge" id="scb-__all__"></span>
          </div>
          {% for f in folders %}
          <div class="sc-item" data-folder="{{ f.name }}">
            <span class="sc-dot"></span>
            <span class="sc-name">{{ f.name }}</span>
            <span class="sc-badge" id="scb-{{ loop.index }}"></span>
          </div>
          {% endfor %}
        {% else %}
          <div class="sidebar-empty">Папки не добавлены —<br><a href="/admin">настройте</a></div>
        {% endif %}
      </div>
    </div>

    <!-- Title (above search form) -->
    <h1 class="hero-title">Поиск по файлам</h1>
    <p class="hero-sub">Документы, таблицы, PDF — всё в одном месте</p>

    <!-- Search form -->
    <form id="searchForm">
      <div class="search-row">
        <div style="position:relative;flex-shrink:0;display:flex" id="historyWrap">
          <button type="button" class="btn-history" id="historyBtn" title="История поиска">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <polyline points="12 8 12 12 14 14"/>
              <path d="M3.05 11a9 9 0 1 0 .5-4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="search-history" id="searchHistory"></div>
        </div>
        <div class="search-container">
          <div class="search-wrap">
            <input type="text" id="query" placeholder='Запрос… или "точная фраза"' autocomplete="off" autofocus>
            <button type="button" class="btn-clear" id="clearBtn" title="Очистить" onclick="clearQuery()">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="submit" class="btn-search">Найти</button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="spinner" id="spinner"></div>
    <span id="statusText"></span>
  </div>

  <!-- Results (only this scrolls) -->
  <div class="results-panel">
    <div id="results"></div>
  </div>

</div>

<!-- Full-text preview modal -->
<div class="ft-overlay" id="ftOverlay">
  <div class="ft-modal">
    <div class="ft-modal-head">
      <div class="ft-modal-title" id="ftTitle"></div>
      <div class="ft-search-wrap">
        <input class="ft-search-input" id="ftSearchInput" placeholder="Поиск…" autocomplete="off">
        <span class="ft-search-count" id="ftSearchCount"></span>
        <button class="ft-btn" id="ftPrev" title="Предыдущее" disabled>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 6.5l3-3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="ft-btn" id="ftNext" title="Следующее" disabled>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <button class="ft-close" id="ftClose" title="Закрыть">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="ft-modal-body">
      <div id="ftContent"></div>
    </div>
  </div>
</div>

<script>
// ── Position sidebar relative to search form ──
(function() {
  function positionSidebar() {
    const ps = document.getElementById('pageSearch');
    const sb = document.getElementById('sidebar');
    const form = document.getElementById('searchForm');
    if (!ps || !sb || !form) return;
    const rect = ps.getBoundingClientRect();
    const formRect = form.getBoundingClientRect();
    sb.style.top = (formRect.top - rect.top) + 'px';
  }
  positionSidebar();
  window.addEventListener('resize', positionSidebar);
})();

// ── Sidebar chips ──
const allItem = document.querySelector('.sc-item[data-folder="__all__"]');

function hasResults() {
  return document.querySelectorAll('.result-card[data-folder]').length > 0;
}

function applyFolderFilter() {
  const cards = document.querySelectorAll('.result-card[data-folder]');
  if (!cards.length) return;
  const sel = selectedFolders();
  let visible = 0;
  cards.forEach(card => {
    const show = !sel.length || sel.includes(card.dataset.folder);
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  statusText.textContent = visible
    ? `Найдено: ${visible} ${plural(visible,'результат','результата','результатов')}`
    : 'Ничего не найдено';
}

document.querySelectorAll('.sc-item[data-folder]').forEach(item => {
  item.addEventListener('click', () => {
    const f = item.dataset.folder;
    if (f === '__all__') {
      document.querySelectorAll('.sc-item').forEach(i => i.classList.remove('active'));
      allItem && allItem.classList.add('active');
    } else {
      allItem && allItem.classList.remove('active');
      item.classList.toggle('active');
      const any = [...document.querySelectorAll('.sc-item[data-folder]')]
        .some(i => i.dataset.folder !== '__all__' && i.classList.contains('active'));
      if (!any && allItem) allItem.classList.add('active');
    }
    if (hasResults()) applyFolderFilter();
  });
});

function selectedFolders() {
  if (!allItem || allItem.classList.contains('active')) return [];
  return [...document.querySelectorAll('.sc-item[data-folder]')]
    .filter(i => i.dataset.folder !== '__all__' && i.classList.contains('active'))
    .map(i => i.dataset.folder);
}

// ── Search ──
const form       = document.getElementById('searchForm');
const input      = document.getElementById('query');
const clearBtn   = document.getElementById('clearBtn');
const spinner    = document.getElementById('spinner');
const statusText = document.getElementById('statusText');
const results    = document.getElementById('results');
const historyBox = document.getElementById('searchHistory');
const historyBtn = document.getElementById('historyBtn');

function updateClearBtn() {
  clearBtn.classList.toggle('visible', input.value.length > 0);
}
function clearQuery() {
  input.value = '';
  updateClearBtn();
  input.focus();
  results.innerHTML = '';
  statusText.textContent = '';
  resetChipCounts();
}
input.addEventListener('input', updateClearBtn);
updateClearBtn();

(function() {
  const wrap = document.getElementById('historyWrap');
  const h = document.querySelector('.search-wrap').offsetHeight;
  wrap.style.width = h + 'px';
  wrap.style.height = h + 'px';
})();

const HIST_KEY = 'nbm_search_history';
function getHistory() { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; } }
function saveToHistory(q) {
  let h = getHistory().filter(x => x !== q);
  h.unshift(q);
  localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 5)));
}
function showHistory() {
  const h = getHistory();
  if (!h.length) return;
  historyBox.innerHTML = h.map(q =>
    `<div class="sh-item" data-q="${esc(q)}">
      <svg class="sh-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <polyline points="12 8 12 12 14 14"/>
        <path d="M3.05 11a9 9 0 1 0 .5-4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ${esc(q)}
    </div>`
  ).join('');
  historyBox.classList.add('visible');
  historyBtn.classList.add('active');
}
function hideHistory() {
  historyBox.classList.remove('visible');
  historyBtn.classList.remove('active');
}

historyBtn.addEventListener('click', e => {
  e.stopPropagation();
  historyBox.classList.contains('visible') ? hideHistory() : showHistory();
});
historyBox.addEventListener('click', e => {
  const item = e.target.closest('.sh-item');
  if (!item) return;
  input.value = item.dataset.q;
  updateClearBtn();
  hideHistory();
  doSearch();
});
document.addEventListener('click', e => {
  if (!historyBox.contains(e.target) && e.target !== historyBtn) hideHistory();
});

form.addEventListener('submit', e => { e.preventDefault(); doSearch(); });

async function doSearch() {
  const q = input.value.trim();
  hideHistory();
  if (!q) { results.innerHTML = ''; statusText.textContent = ''; return; }
  saveToHistory(q);
  spinner.classList.add('visible');
  statusText.textContent = 'Поиск…';
  results.innerHTML = '';
  const sel = selectedFolders();
  const params = new URLSearchParams({ q });
  sel.forEach(f => params.append('folders', f));
  try {
    const res = await fetch('/search?' + params);
    const data = await res.json();
    spinner.classList.remove('visible');
    if (data.error) { statusText.textContent = 'Ошибка: ' + data.error; return; }
    const items = data.results;
    statusText.textContent = items.length
      ? `Найдено: ${items.length} ${plural(items.length,'результат','результата','результатов')}`
      : 'Ничего не найдено';
    updateChipCounts(items);
    if (!items.length) {
      results.innerHTML = `<div class="no-results">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/>
        </svg><p>По запросу «${esc(q)}» ничего не найдено</p></div>`;
      return;
    }
    results.innerHTML = items.map(r => {
      const ext = r.name.split('.').pop().toLowerCase();
      const date = r.modified_at
        ? new Date(r.modified_at * 1000).toLocaleDateString('ru-RU', {day:'2-digit', month:'short', year:'numeric'})
        : '';
      const encPath = encodeURIComponent(r.path);
      return `<div class="result-card" data-folder="${esc(r.folder_name || '')}">
        <div class="rc-top">
          <div class="rc-name" title="${esc(r.path)}">${esc(r.name)}</div>
          ${(dir => dir ? `<span class="rc-badge rc-badge-dir">${esc(dir)}</span>` : '')(r.path.replace(/\\/g,'/').split('/').slice(-2,-1)[0] || '')}
          <span class="rc-badge ext-${ext}">.${ext}</span>
        </div>
        ${r.snippet ? `<div class="rc-snippet" style="cursor:pointer" title="Нажмите для просмотра полного текста" onclick="openFtModal(${esc(JSON.stringify(r.path))}, ${esc(JSON.stringify(r.name))})">${r.snippet}</div>` : ''}
        <div class="rc-bottom">
          <div class="rc-meta">
            ${r.folder_name ? `<span>📁 ${esc(r.folder_name)}</span>` : ''}
            ${date ? `<span>${date}</span>` : ''}
          </div>
          <div class="rc-actions">
            <a class="btn-action" href="nbmsearch://open/${encPath}">▶ Открыть</a>
            <a class="btn-action" href="nbmsearch://folder/${encPath}">📁 Папка</a>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    spinner.classList.remove('visible');
    statusText.textContent = 'Ошибка соединения';
  }
}

// ── Chip counts ──
function updateChipCounts(items) {
  const counts = {};
  items.forEach(r => { if (r.folder_name) counts[r.folder_name] = (counts[r.folder_name] || 0) + 1; });
  const allBadge = document.getElementById('scb-__all__');
  if (allBadge) { allBadge.textContent = items.length; allBadge.classList.toggle('visible', items.length > 0); }
  let idx = 1;
  document.querySelectorAll('.sc-item[data-folder]').forEach(item => {
    const name = item.dataset.folder;
    if (name === '__all__') return;
    const badge = document.getElementById(`scb-${idx}`);
    if (badge) { const n = counts[name] || 0; badge.textContent = n; badge.classList.toggle('visible', n > 0); }
    idx++;
  });
}
function resetChipCounts() {
  document.querySelectorAll('.sc-badge').forEach(b => { b.textContent = ''; b.classList.remove('visible'); });
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function plural(n,one,few,many){ const m=n%100; if(m>=11&&m<=14)return many; const r=n%10; if(r===1)return one; if(r>=2&&r<=4)return few; return many; }

// ── Full-text modal ──
const ftOverlay    = document.getElementById('ftOverlay');
const ftTitle      = document.getElementById('ftTitle');
const ftContent    = document.getElementById('ftContent');
const ftSearchInput= document.getElementById('ftSearchInput');
const ftSearchCount= document.getElementById('ftSearchCount');
const ftPrev       = document.getElementById('ftPrev');
const ftNext       = document.getElementById('ftNext');

let _ftRawText = '';
let _ftMatches = [];
let _ftCurrent = -1;

document.getElementById('ftClose').addEventListener('click', closeFtModal);
ftOverlay.addEventListener('click', e => { if (e.target === ftOverlay) closeFtModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeFtModal(); return; }
  if (!ftOverlay.classList.contains('visible')) return;
  if (e.key === 'Enter' && document.activeElement === ftSearchInput) {
    e.preventDefault(); e.shiftKey ? ftGoPrev() : ftGoNext();
  }
});

ftSearchInput.addEventListener('input', () => ftHighlight(ftSearchInput.value));
ftPrev.addEventListener('click', ftGoPrev);
ftNext.addEventListener('click', ftGoNext);

function closeFtModal() {
  ftOverlay.classList.remove('visible');
  ftSearchInput.value = '';
  ftSearchCount.textContent = '';
  ftPrev.disabled = ftNext.disabled = true;
  _ftMatches = []; _ftCurrent = -1; _ftRawText = '';
}

function ftHighlight(q) {
  if (!_ftRawText) return;
  if (!q) {
    ftContent.innerHTML = `<div class="ft-text">${esc(_ftRawText)}</div>`;
    ftSearchCount.textContent = '';
    ftPrev.disabled = ftNext.disabled = true;
    _ftMatches = []; _ftCurrent = -1;
    return;
  }
  const lower = _ftRawText.toLowerCase();
  const ql = q.toLowerCase();
  _ftMatches = [];
  let i = 0;
  while ((i = lower.indexOf(ql, i)) !== -1) { _ftMatches.push(i); i += ql.length; }
  if (!_ftMatches.length) {
    ftContent.innerHTML = `<div class="ft-text">${esc(_ftRawText)}</div>`;
    ftSearchCount.textContent = '0 / 0';
    ftPrev.disabled = ftNext.disabled = true;
    _ftCurrent = -1;
    return;
  }
  _ftCurrent = 0;
  ftPrev.disabled = ftNext.disabled = false;
  ftRender(q);
  setTimeout(ftScrollToCurrent, 0);
}

function ftRender(q) {
  if (!q) q = ftSearchInput.value;
  const ql = q.toLowerCase();
  const text = _ftRawText;
  let html = '';
  let pos = 0;
  _ftMatches.forEach((start, idx) => {
    html += esc(text.slice(pos, start));
    const cls = idx === _ftCurrent ? 'ft-active' : '';
    html += `<mark id="ftm-${idx}" class="${cls}">${esc(text.slice(start, start + ql.length))}</mark>`;
    pos = start + ql.length;
  });
  html += esc(text.slice(pos));
  ftContent.innerHTML = `<div class="ft-text">${html}</div>`;
  ftSearchCount.textContent = `${_ftCurrent + 1} / ${_ftMatches.length}`;
}

function ftScrollToCurrent() {
  const el = document.getElementById('ftm-' + _ftCurrent);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function ftGoNext() {
  if (!_ftMatches.length) return;
  _ftCurrent = (_ftCurrent + 1) % _ftMatches.length;
  ftRender(); ftScrollToCurrent();
}

function ftGoPrev() {
  if (!_ftMatches.length) return;
  _ftCurrent = (_ftCurrent - 1 + _ftMatches.length) % _ftMatches.length;
  ftRender(); ftScrollToCurrent();
}

async function openFtModal(path, name) {
  ftTitle.textContent = name;
  ftSearchInput.value = '';
  ftSearchCount.textContent = '';
  ftPrev.disabled = ftNext.disabled = true;
  _ftMatches = []; _ftCurrent = -1; _ftRawText = '';
  ftContent.innerHTML = '<div class="ft-loading"><span class="ft-spinner"></span>Загрузка…</div>';
  ftOverlay.classList.add('visible');
  try {
    const res = await fetch('/api/file-text?path=' + encodeURIComponent(path));
    const data = await res.json();
    if (data.error) {
      ftContent.innerHTML = `<div class="ft-loading">Ошибка: ${esc(data.error)}</div>`;
    } else {
      _ftRawText = data.text || '';
      ftContent.innerHTML = `<div class="ft-text">${esc(_ftRawText)}</div>`;
      const q = input.value.trim().replace(/^["«»]+|["«»]+$/g, '');
      if (q) {
        ftSearchInput.value = q;
        ftHighlight(q);
      } else {
        setTimeout(() => ftSearchInput.focus(), 50);
      }
    }
  } catch {
    ftContent.innerHTML = '<div class="ft-loading">Ошибка соединения</div>';
  }
}

// ── Theme ──
(function() {
  if (localStorage.getItem('nbm_theme') === 'light')
    document.documentElement.setAttribute('data-theme', 'light');
})();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  if (isLight) { html.removeAttribute('data-theme'); localStorage.setItem('nbm_theme', 'dark'); }
  else { html.setAttribute('data-theme', 'light'); localStorage.setItem('nbm_theme', 'light'); }
}
</script>
