name: Build Windows EXE
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Get version
        id: ver
        run: |
          $ver = (Select-String -Path 'app/settings.py' -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Convert icon PNG → ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('icon.png').convert('RGBA')
          img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          "

      - name: Build main EXE
        run: |
          pyinstaller --onefile --windowed --name NbmSearch `
            --icon icon.ico `
            --add-data "templates;templates" `
            --add-data "icon.png;." `
            --add-data "templates/help1.png;." `
            --add-data "templates/help2.png;." `
            --hidden-import "app.main" `
            --hidden-import "app.database" `
            --hidden-import "app.indexer" `
            --hidden-import "app.config" `
            --hidden-import "app.settings" `
            --hidden-import "PIL" `
            --hidden-import "PIL.Image" `
            --hidden-import "PIL.ImageTk" `
            launcher.py

      - name: Build opener EXE
        run: |
          pyinstaller --onefile --windowed --name NbmSearchHelper `
            --icon icon.ico `
            --add-data "icon.png;." `
            open_handler.py

      - name: Build updater EXE
        run: |
          pyinstaller --onefile --windowed --name NbmSearchUpdater `
            --icon icon.ico `
            NbmSearchUpdater.py

      - name: Package management panel
        run: |
          Compress-Archive -Path management-panel\* -DestinationPath dist\NbmSearchPanel.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NbmSearch v${{ steps.ver.outputs.version }}
          files: |
            dist/NbmSearch.exe
            dist/NbmSearchHelper.exe
            dist/NbmSearchUpdater.exe
            dist/NbmSearchPanel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
