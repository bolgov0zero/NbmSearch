name: Build Windows EXE

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Convert icon PNG → ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('icon.png').convert('RGBA')
          img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])
          "

      - name: Build main EXE
        run: |
          pyinstaller --onefile --windowed --name NbmSearch `
            --icon icon.ico `
            --add-data "templates;templates" `
            --add-data "icon.png;." `
            --hidden-import "app.main" `
            --hidden-import "app.database" `
            --hidden-import "app.indexer" `
            --hidden-import "app.config" `
            --hidden-import "app.settings" `
            --hidden-import "PIL" `
            --hidden-import "PIL.Image" `
            --hidden-import "PIL.ImageTk" `
            launcher.py

      - name: Build opener EXE
        run: |
          pyinstaller --onefile --windowed --name NbmSearchOpen `
            --icon icon.ico `
            --add-data "icon.png;." `
            open_handler.py

      - name: Rename artifacts
        run: |
          mv dist/NbmSearch.exe dist/NbmSearch-windows.exe
          mv dist/NbmSearchOpen.exe dist/NbmSearchOpen-windows.exe

      - name: Generate release tag
        id: tag
        run: echo "tag=$(Get-Date -Format 'yyyy-MM-dd-HH-mm')" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: NbmSearch ${{ steps.tag.outputs.tag }}
          files: |
            dist/NbmSearch-windows.exe
            dist/NbmSearchOpen-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
